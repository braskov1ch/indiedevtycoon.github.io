<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0f1117" />
<title>Indie Dev Tycoon</title>
<style>
:root{
  --bg:#0f1117;
  --bg2:#161a24;
  --card:#1c2130;
  --card2:#232a3c;
  --border:#2a3145;
  --txt:#e6ebf5;
  --txt2:#8b95ab;
  --accent:#6c8cff;
  --accent2:#a96cff;
  --green:#39d98a;
  --red:#ff5d6c;
  --yellow:#ffcc4d;
  --orange:#ff9c4d;
  --radius:14px;
  --topH:56px;
  --botH:60px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;font-size:15px;line-height:1.35}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;color:var(--txt);background:transparent}
input,select{font-family:inherit;font-size:16px;background:var(--bg2);color:var(--txt);border:1px solid var(--border);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--accent)}
h1,h2,h3,h4{margin:0 0 8px 0}
h1{font-size:26px;letter-spacing:1px}
h2{font-size:20px}
h3{font-size:16px}
h4{font-size:14px;color:var(--txt2);text-transform:uppercase;letter-spacing:.8px;font-weight:600}

.screen-start{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 20% 10%,rgba(108,140,255,.15),transparent 55%),radial-gradient(circle at 80% 90%,rgba(169,108,255,.15),transparent 55%),var(--bg)}
.start-card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:26px 22px;text-align:center}
.start-card h1{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-size:28px;margin-bottom:4px}
.subtitle{color:var(--txt2);font-size:13px;margin-bottom:20px}
.start-form{display:flex;flex-direction:column;gap:12px;margin-bottom:18px;text-align:left}
.start-form label{font-size:13px;color:var(--txt2);display:block}
.start-form label input,.start-form label select{margin-top:4px}
.btn-primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;font-weight:700;border-radius:12px;padding:12px 16px;width:100%;letter-spacing:.5px}
.btn-ghost{background:var(--card2);color:var(--txt);border:1px solid var(--border);border-radius:12px;padding:12px 16px;width:100%;margin-top:8px}
.btn-primary.big,.btn-ghost.big{padding:14px 18px;font-size:15px}
.credit{color:var(--txt2);font-size:11px;margin-top:14px;letter-spacing:.3px}

#app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;padding-bottom:calc(var(--botH) + env(safe-area-inset-bottom))}
#topbar{position:sticky;top:0;z-index:20;height:var(--topH);display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:rgba(22,26,36,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.tb-left{display:flex;flex-direction:column;line-height:1.15}
#tb-studio{font-weight:700;font-size:14px}
#tb-date{font-size:11px;color:var(--txt2)}
.tb-right{display:flex;align-items:center;gap:6px}
.speed-group{display:flex;gap:2px;background:var(--card2);border-radius:10px;padding:3px}
.spd{padding:6px 8px;border-radius:8px;font-size:12px;min-width:28px;color:var(--txt2)}
.spd.active{background:var(--accent);color:#fff}
.tb-mini{background:var(--card2);padding:6px 8px;border-radius:8px;font-size:11px;color:var(--txt2)}

#main{flex:1;padding:12px;max-width:900px;width:100%;margin:0 auto}

#bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:var(--botH);padding-bottom:env(safe-area-inset-bottom);display:flex;justify-content:space-around;background:rgba(22,26,36,.98);backdrop-filter:blur(12px);border-top:1px solid var(--border)}
#bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--txt2);font-size:10px;padding:6px 0}
#bottomnav button span{font-size:20px;line-height:1}
#bottomnav button.active{color:var(--accent)}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.card.tight{padding:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row+.row{margin-top:6px}
.sub{color:var(--txt2);font-size:12px}
.mono{font-variant-numeric:tabular-nums}
.green{color:var(--green)}.red{color:var(--red)}.yellow{color:var(--yellow)}.orange{color:var(--orange)}.accent{color:var(--accent)}
.big-num{font-size:22px;font-weight:700}
.divider{height:1px;background:var(--border);margin:10px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{padding:8px 10px;background:var(--bg2);border-radius:10px}
.stat .lbl{font-size:11px;color:var(--txt2)}
.stat .val{font-size:16px;font-weight:700;margin-top:2px}

.pbar{height:8px;background:var(--bg2);border-radius:6px;overflow:hidden;margin:6px 0}
.pbar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s ease;border-radius:6px}
.pbar.green>div{background:linear-gradient(90deg,#39d98a,#1cb877)}
.pbar.red>div{background:linear-gradient(90deg,#ff5d6c,#c93a48)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:10px;background:var(--card2);border:1px solid var(--border);font-weight:600;font-size:13px;min-height:42px}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent2));border:none;color:#fff}
.btn.danger{background:#3a2030;border-color:#553;color:#ff8a94}
.btn.small{padding:6px 10px;min-height:34px;font-size:12px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}

.list-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:none}
.list-item .li-main{flex:1;min-width:0}
.list-item .li-title{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .li-sub{color:var(--txt2);font-size:11px;margin-top:2px}
.tag{display:inline-block;font-size:10px;background:var(--card2);border-radius:6px;padding:2px 6px;color:var(--txt2);margin-right:4px}
.tag.green{background:rgba(57,217,138,.15);color:var(--green)}
.tag.red{background:rgba(255,93,108,.15);color:var(--red)}
.tag.yellow{background:rgba(255,204,77,.15);color:var(--yellow)}
.tag.accent{background:rgba(108,140,255,.15);color:var(--accent)}

#toast-root{position:fixed;left:12px;right:12px;bottom:calc(var(--botH) + 12px);z-index:100;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:var(--card2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:slideUp .25s ease;pointer-events:auto}
.toast.err{border-left-color:var(--red)}
.toast.ok{border-left-color:var(--green)}
.toast.warn{border-left-color:var(--yellow)}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{background:var(--card);border-top-left-radius:20px;border-top-right-radius:20px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:slideUp .28s ease}
.modal h2{font-size:18px;margin-bottom:12px}
.modal .close-row{display:flex;justify-content:flex-end;margin-top:12px;gap:8px}
.modal label{display:block;font-size:12px;color:var(--txt2);margin-top:10px}
.modal label>input,.modal label>select{margin-top:4px}
.modal .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.news-item{padding:10px 12px;background:var(--bg2);border-radius:10px;margin-bottom:8px;font-size:13px;border-left:3px solid var(--accent)}
.news-item .news-date{color:var(--txt2);font-size:11px;margin-bottom:2px}
.news-item.good{border-left-color:var(--green)}
.news-item.bad{border-left-color:var(--red)}
.news-item.warn{border-left-color:var(--yellow)}
.news-item.hist{border-left-color:var(--accent2)}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--border)}
th{color:var(--txt2);font-weight:600;font-size:11px;text-transform:uppercase}

svg.chart{width:100%;height:120px;display:block}

@media (min-width:900px){
  #app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:var(--topH) 1fr;height:100vh;height:100dvh;padding-bottom:0}
  #topbar{grid-column:1/-1}
  #main{grid-column:2;grid-row:2;overflow-y:auto;padding:20px;max-width:none}
  #bottomnav{position:static;grid-column:1;grid-row:2;flex-direction:column;justify-content:flex-start;height:auto;padding:8px 6px;border-top:none;border-right:1px solid var(--border);gap:2px}
  #bottomnav button{flex-direction:row;justify-content:flex-start;gap:10px;padding:12px 14px;font-size:14px;border-radius:10px;flex:0 0 auto}
  #bottomnav button span{font-size:18px}
  #bottomnav button.active{background:var(--card2)}
  .modal-bg{align-items:center;padding:20px}
  .modal{border-radius:20px;max-height:80vh}
  #toast-root{bottom:20px;left:auto;right:20px;width:320px}
  h1{font-size:32px}
  .grid2{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
}
</style>
</head>
<body>

<div id="start-screen" class="screen-start">
  <div class="start-card">
    <h1>INDIE DEV TYCOON</h1>
    <p class="subtitle">Build your studio. Ship your games. Survive the industry.</p>

    <div class="start-form">
      <label>Studio name
        <input id="in-studio" type="text" maxlength="24" placeholder="Pixel Forge" />
      </label>
      <label>Developer name
        <input id="in-name" type="text" maxlength="20" placeholder="Alex" />
      </label>
      <label>Country
        <select id="in-country"></select>
      </label>
      <label>Start year
        <select id="in-year"></select>
      </label>
      <label>Difficulty
        <select id="in-diff">
          <option value="easy">Easy</option>
          <option value="normal" selected>Normal</option>
          <option value="hard">Hard</option>
        </select>
      </label>
    </div>

    <button id="btn-start" class="btn-primary big">START STUDIO</button>
    <button id="btn-continue" class="btn-ghost big" style="display:none">CONTINUE SAVED GAME</button>

    <p class="credit">Game by @braskov1ch · v0.1beta · © 2026</p>
  </div>
</div>

<div id="app" style="display:none">
  <header id="topbar">
    <div class="tb-left">
      <div id="tb-studio">Studio</div>
      <div id="tb-date">1 Jan 2008</div>
    </div>
    <div class="tb-right">
      <div class="speed-group">
        <button data-speed="0" class="spd">⏸</button>
        <button data-speed="1" class="spd active">▶</button>
        <button data-speed="2" class="spd">▶▶</button>
        <button data-speed="5" class="spd">▶▶▶</button>
        <button data-speed="10" class="spd">▶▶▶▶</button>
      </div>
      <button id="btn-step-day" class="tb-mini">+1д</button>
      <button id="btn-step-week" class="tb-mini">+7д</button>
    </div>
  </header>

  <main id="main"></main>

  <nav id="bottomnav">
    <button data-tab="dashboard" class="active"><span>🏠</span>Обзор</button>
    <button data-tab="projects"><span>🎮</span>Проекты</button>
    <button data-tab="studio"><span>👥</span>Студия</button>
    <button data-tab="market"><span>📊</span>Рынок</button>
    <button data-tab="news"><span>📰</span>Новости</button>
    <button data-tab="more"><span>⚙️</span>Ещё</button>
  </nav>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

const SAVE_KEY   = 'indieDevTycoon_save_v1';
const BACKUP_KEY = 'indieDevTycoon_backup';

const OFFLINE_DAY_CAP = 90;

let _offlineMode = false;

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const rndInt=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const num=v=>{v=Number(v);return Number.isFinite(v)?v:0;};
const add=(a,b)=>num(a)+num(b);
const sub=(a,b)=>num(a)-num(b);
const fmt=n=>{n=num(n);const a=Math.abs(n);let s;if(a>=1e9)s=(n/1e9).toFixed(2)+'B';else if(a>=1e6)s=(n/1e6).toFixed(2)+'M';else if(a>=1e3)s=(n/1e3).toFixed(1)+'K';else s=Math.round(n).toString();return '$'+s;};
const fmtNum=n=>{n=num(n);const a=Math.abs(n);if(a>=1e6)return (n/1e6).toFixed(2)+'M';if(a>=1e3)return (n/1e3).toFixed(1)+'K';return Math.round(n).toString();};
const MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_EN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS_IN_MONTH=[31,28,31,30,31,30,31,31,30,31,30,31];
function daysInMonth(y,m){if(m===1&&((y%4===0&&y%100!==0)||y%400===0))return 29;return DAYS_IN_MONTH[m];}
function dateToStr(d){return `${d.day} ${MONTHS[d.month]} ${d.year}`;}
function dateToStrShort(d){return `${MONTHS_EN[d.month]} ${d.year}`;}
function dateToStrFull(d){return `${String(d.day).padStart(2,'0')}.${String(d.month+1).padStart(2,'0')}.${d.year}`;}

let state = null;
let speed = 1;
let lastRealTime = 0;
let accumMs = 0;
let running = false;
let domUpdateTimer = 0;

function newState(){
  return {
    version: 'v0.1beta',
    player:{ name:'Alex', studio:'Pixel Forge', country:'us', difficulty:'normal', startYear:2008 },
    date:{ year:2008, month:0, day:1 },
    money:30000,
    rep:1, fans:0, energy:100, hype:0, popularity:5,
    skills:{ programming:5, design:5, art:5, audio:5, management:5, marketing:5 },
    employees:[],
    projects:[],
    releasedGames:[],
    ips:[],
    contracts:[],
    contractOffers:[],
    engines:[],
    research:{ unlocked:['2d'], active:null, completed:[] },
    awards:[],
    news:[],
    trends:{ genres:{}, themes:{}, updatedYear:-1 },
    competitors: [],
    timelineDone:[],
    stats:{
      totalRevenue:0, totalExpenses:0, gamesReleased:0, monthsPlayed:0,
      bestGame:null, bestReview:0, totalSales:0, awards:0,
      history:[],
    },
    finance:{ lastMonthIncome:0, lastMonthExpense:0, monthIncome:0, monthExpense:0, lastDlcIncome:0 },
    flags:{ lastDaily:null, dailyStreak:0, lastDayTs:Date.now(), startedAt:Date.now(), endedAt:null },
    settings:{ showTutorial:true },
    tutorialDone:false,
  };
}

function saveGame(){
  if(_offlineMode) return true;
  try{
    state.flags.lastDayTs = Date.now();
    const json = JSON.stringify(state);
    localStorage.setItem(SAVE_KEY, json);
    localStorage.setItem(BACKUP_KEY, json);
    return true;
  }catch(e){console.error('save failed',e);return false;}
}

function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY) || localStorage.getItem(BACKUP_KEY);
    if(!raw) return null;
    const obj = JSON.parse(raw);
    if(!obj || typeof obj !== 'object') throw new Error('bad save');
    return migrate(obj);
  }catch(e){
    console.error('load failed',e);
    toast('Не удалось загрузить сохранение. Создан бэкап.','err');
    try{ localStorage.setItem(BACKUP_KEY+'_corrupt_'+Date.now(), localStorage.getItem(SAVE_KEY)||''); }catch(_){}
    return null;
  }
}

function migrate(s){
  const base = newState();
  const merged = Object.assign({}, base, s);
  merged.skills = Object.assign({}, base.skills, s.skills||{});
  merged.stats = Object.assign({}, base.stats, s.stats||{});
  merged.finance = Object.assign({}, base.finance, s.finance||{});
  merged.flags = Object.assign({}, base.flags, s.flags||{});
  merged.settings = Object.assign({}, base.settings, s.settings||{});
  merged.player = Object.assign({}, base.player, s.player||{});
  for(const k of ['projects','releasedGames','employees','ips','contracts','contractOffers','engines','awards','news','timelineDone','competitors']){
    if(!Array.isArray(merged[k])) merged[k] = [];
  }
  if(!merged.research || typeof merged.research !== 'object') merged.research = base.research;
  if(!Array.isArray(merged.research.completed)) merged.research.completed = [];
  if(!Array.isArray(merged.research.unlocked)) merged.research.unlocked = ['2d'];
  if(!merged.trends || typeof merged.trends !== 'object') merged.trends = base.trends;
  if(!merged.trends.genres) merged.trends.genres = {};
  if(!merged.trends.themes) merged.trends.themes = {};
  for(const k of ['money','rep','fans','energy','hype','popularity']){
    if(!Number.isFinite(Number(merged[k]))) merged[k] = (k==='money'?30000:0);
  }
  if(!merged.date || !Number.isFinite(merged.date.year)) merged.date = base.date;
  if(!Number.isFinite(merged.date.month)) merged.date.month = 0;
  if(!Number.isFinite(merged.date.day)) merged.date.day = 1;
  if(!merged.player.startYear) merged.player.startYear = merged.date.year;
  return merged;
}

function tickDay(){
  const d = state.date;
  d.day++;
  const max = daysInMonth(d.year,d.month);
  if(d.day>max){
    d.day=1;d.month++;
    if(d.month>11){d.month=0;d.year++;onYearChange();}
    onMonthChange();
  }
  state.energy = clamp(state.energy+2,0,100);
  state.hype = Math.max(0, state.hype - 0.5);
  state.popularity = clamp(state.popularity*0.995 + state.rep*0.005, 0, 100);

  tickEngines(1);
  tickResearch(1);
  for(const p of state.projects.slice()) projectTick(p, 1);
  progressContractByDays(1);
  checkTimeline();

  if(!_offlineMode && state.date.day%3===0) saveGame();
}

function onMonthChange(){
  state.stats.monthsPlayed++;
  state.stats.history.push({
    year:state.date.year, month:state.date.month,
    money:Math.round(state.money), fans:Math.round(state.fans),
    rep:state.rep, games:state.stats.gamesReleased,
    revenue:Math.round(state.stats.totalRevenue),
  });
  if(state.stats.history.length>400) state.stats.history.shift();
  state.finance.lastMonthIncome = state.finance.monthIncome;
  state.finance.lastMonthExpense = state.finance.monthExpense;
  state.finance.monthIncome = 0;
  state.finance.monthExpense = 0;
  paySalaries();
  payOperations();
  processMonthlySales();
  competitorMonthTick();
  if(Math.random()<0.18) triggerRandomEvent();
  if(state.date.month%3===0) updateTrends();
  if(state.date.month===11) holdAwards();
  if(!state.tutorialDone && state.stats.gamesReleased>=1 && state.employees.length>=1){ state.tutorialDone=true; }
}

function onYearChange(){
  addNews(`Новый год: ${state.date.year}.`, 'hist');
  state.hype = Math.max(0, state.hype*0.5);
}

function paySalaries(){
  let total = 0;
  const diff = DATA.DIFFICULTY[state.player.difficulty]||DATA.DIFFICULTY.normal;
  for(const e of state.employees){
    const s = e.salary * diff.salaryMul;
    total += s;
    e.morale = clamp(e.morale - (Math.random()<0.2?1:0) + (Math.random()<0.25?1:0), 20, 100);
    e.exp += rnd(0.3,1.5);
    if(e.exp>50){ e.exp=0; e.skill=clamp(e.skill+1,1,100); addNews(`${e.name} повысил навык до ${e.skill}.`, 'good'); }
  }
  if(total>0){ spend(total,'salaries'); }
}

function payOperations(){
  const base = 400 + state.employees.length*60;
  const co = (DATA.COUNTRIES.find(c=>c.id===state.player.country)||{costOfLiving:1}).costOfLiving;
  spend(base*co,'operations');
}

function spend(amount, reason){
  amount = num(amount);
  if(amount<0) amount=0;
  state.money = sub(state.money, amount);
  state.finance.monthExpense += amount;
  state.stats.totalExpenses += amount;
  if(state.money<-20000) addNews('Кредиторы требуют платежи. Студия в опасности!', 'bad');
}

function earn(amount, reason){
  amount = num(amount);
  if(amount<0) amount=0;
  state.money = add(state.money, amount);
  state.finance.monthIncome += amount;
  state.stats.totalRevenue += amount;
}

function toast(msg, kind=''){
  const el=document.createElement('div');
  el.className='toast '+(kind||'');
  el.textContent=msg;
  $('#toast-root').appendChild(el);
  setTimeout(()=>{el.style.transition='opacity .3s';el.style.opacity='0';setTimeout(()=>el.remove(),320);},2600);
}

function openModal(html, opts={}){
  const bg=document.createElement('div');
  bg.className='modal-bg';
  bg.innerHTML=`<div class="modal">${html}</div>`;
  bg.addEventListener('click',e=>{if(e.target===bg && !opts.noClose) closeModal();});
  $('#modal-root').appendChild(bg);
  if(opts.onMount) opts.onMount(bg);
  return bg;
}
function closeModal(){ const m=$('#modal-root').firstChild; if(m) m.remove(); }
function closeAllModals(){ $('#modal-root').innerHTML=''; }

function startLoop(){
  running = true;
  lastRealTime = Date.now();
  accumMs = 0;
  requestAnimationFrame(loop);
}

function loop(){
  if(!running) return;
  const now = Date.now();
  const dt = now-lastRealTime;
  lastRealTime = now;
  if(speed>0 && state && !_offlineMode){
    accumMs += dt*speed;
    let safety=0;
    while(accumMs>=DAY_MS && safety<500){
      accumMs -= DAY_MS;
      tickDay();
      safety++;
    }
    if(safety>=500) accumMs = 0;
  }
  domUpdateTimer += dt;
  if(domUpdateTimer>250){
    domUpdateTimer=0;
    if(state) renderCurrent();
  }
  requestAnimationFrame(loop);
}

function processOffline(){
  if(!state || !state.flags.lastDayTs) return;
  const now = Date.now();
  const elapsedRealMs = clamp(now - state.flags.lastDayTs, 0, 7*24*3600*1000);
  const gameDaysRaw = Math.floor(elapsedRealMs / DAY_MS);
  const gameDays = Math.min(gameDaysRaw, OFFLINE_DAY_CAP);
  if(gameDays < 1) return;

  const before = {
    money: state.money, fans: state.fans, rep: state.rep,
    totalSales: state.stats.totalSales|0,
  };

  _offlineMode = true;
  for(let i=0;i<gameDays;i++){
    try { tickDay(); } catch(e){ console.error('offline tick', e); break; }
  }
  _offlineMode = false;

  const deltaMoney = state.money - before.money;
  const deltaFans  = state.fans - before.fans;
  const deltaSales = (state.stats.totalSales|0) - before.totalSales;

  showOfflineSummary(gameDays, gameDaysRaw, deltaMoney, deltaFans, deltaSales);
  saveGame();
}

function showOfflineSummary(gameDays, gameDaysRaw, deltaMoney, deltaFans, deltaSales){
  const capped = gameDaysRaw > gameDays;
  const cls = deltaMoney>=0?'green':'red';
  openModal(`
    <h2>Пока вас не было</h2>
    <p class="sub">Игровых дней: <b>${gameDays}</b>${capped?` <span class="yellow">(из ${gameDaysRaw}, лимит ${OFFLINE_DAY_CAP})</span>`:''}</p>
    <div class="divider"></div>
    <div class="row"><span>Баланс</span><span class="${cls} big-num">${deltaMoney>=0?'+':''}${fmt(deltaMoney)}</span></div>
    <div class="row"><span>Фанаты</span><span>${deltaFans>=0?'+':''}${fmtNum(deltaFans)}</span></div>
    <div class="row"><span>Продажи (копий)</span><span>${fmtNum(deltaSales)}</span></div>
    <div class="divider"></div>
    <div class="row"><span>Текущий баланс</span><span>${fmt(state.money)}</span></div>
    <div class="row"><span>Фанатов сейчас</span><span>${fmtNum(state.fans)}</span></div>
    <div class="close-row"><button class="btn primary" onclick="closeAllModals()">OK</button></div>
  `, {noClose:true});
}

function monthsBetween(a,b){
  return (b.year-a.year)*12 + (b.month-a.month);
}

function computeSalePrice(project){
  const sizeIdx = {tiny:5, small:9, medium:19, large:29, aaa:59};
  let base = sizeIdx[project.size]||9;
  const age = monthsBetween({year:project.releaseYear,month:project.releaseMonth}, state.date);
  if(age>12) base = Math.max(2, base*0.7);
  if(age>36) base = Math.max(2, base*0.5);
  return Math.round(base*100)/100;
}

function computeMonthlySales(game){
  const platform = DATA.PLATFORMS.find(p=>p.id===game.platform);
  if(!platform) return 0;
  const now = state.date;
  const rel = {year:game.releaseYear, month:game.releaseMonth};
  const age = Math.max(0, monthsBetween(rel, now));

  let life;
  if(age<2) life = 2.2;
  else if(age<6) life = 1.4;
  else if(age<12) life = 1.0;
  else if(age<24) life = 0.55;
  else if(age<48) life = 0.22;
  else life = 0.07;

  const quality = num(game.quality)/100;
  const critics = num(game.critics)/100;
  const players = num(game.players)/100;
  const basePlatform = platform.marketSize;
  const trend = (state.trends.genres[game.genre]||1);
  const dlcBoost = 1 + num(game.dlcBoost);
  const hype = num(game.hypeAtRelease)/100 * Math.max(0, 1 - age/12);
  const mkt = 1 + num(game.marketing)/100 * 0.5;
  const repMul = 0.6 + state.rep*0.04;
  const fansMul = 1 + Math.log10(1+state.fans)/8;
  const diff = DATA.DIFFICULTY[state.player.difficulty]||DATA.DIFFICULTY.normal;
  const comp = game.compPenalty||1;

  let sales = basePlatform * 4.0 *
    Math.pow(0.4+quality, 2.2) *
    (0.6 + 0.4*(critics+players)/2) *
    life * trend * dlcBoost * mkt * repMul * fansMul * diff.salesMul *
    (0.6 + 0.4*(1+hype)) / comp;

  const revenuePerCopy = computeSalePrice(game);
  const gross = sales * revenuePerCopy * (1 - platform.fee);
  let devShare = 1;
  if(game.publisher && typeof game.publisher.share === 'number') devShare = game.publisher.share;
  const netRevenue = gross * devShare;

  game.monthlySales = Math.max(0, Math.floor(sales));
  game.monthlyRevenue = Math.max(0, netRevenue);
  if(game.dlcBoost>0) game.dlcBoost = Math.max(0, game.dlcBoost - 0.08);
  return sales;
}

function processMonthlySales(){
  let totalSales = 0;
  let totalRevenue = 0;
  for(const g of state.releasedGames){
    const s = computeMonthlySales(g);
    totalSales += s;
    totalRevenue += g.monthlyRevenue;
    g.totalSales = (g.totalSales|0) + (s|0);
    g.lifetimeRevenue = num(g.lifetimeRevenue) + g.monthlyRevenue;
    g.lastMonthSales = s;
    g.lastMonthRevenue = g.monthlyRevenue;
    const newFans = s * 0.15;
    state.fans = add(state.fans, newFans);
    if(g.critics>=80 && Math.random()<0.2) state.rep = add(state.rep, 0.05);
  }
  if(totalRevenue>0) earn(totalRevenue, 'sales');
  state.stats.totalSales = num(state.stats.totalSales) + totalSales;

  let dlcIncome = 0;
  for(const g of state.releasedGames){
    if((g.dlcCount|0)>0){
      const inc = (g.dlcCount|0) * 200 * (state.rep*0.05+0.5);
      dlcIncome += inc;
    }
  }
  if(dlcIncome>0) earn(dlcIncome, 'dlc');
  state.finance.lastDlcIncome = dlcIncome;
}

function updateTrends(){
  const genres = state.trends.genres;
  const themes = state.trends.themes;
  for(const g of DATA.GENRES){
    let t = genres[g.id]||1.0;
    t += rnd(-0.25,0.25);
    t = clamp(t, 0.6, 1.5);
    genres[g.id] = Math.round(t*100)/100;
  }
  for(const t of DATA.THEMES){
    let v = themes[t.id]||1.0;
    v += rnd(-0.2,0.2);
    v = clamp(v, 0.7, 1.35);
    themes[t.id] = Math.round(v*100)/100;
  }
  state.trends.updatedYear = state.date.year;
}

function generateContractOffer(){
  const diffs = DATA.DIFFICULTY[state.player.difficulty]||DATA.DIFFICULTY.normal;
  const budgetBase = [8000, 25000, 60000, 120000][Math.min(3, Math.floor(state.rep/8))] || 8000;
  const budget = Math.round(budgetBase * rnd(0.7,1.4) * diffs.salesMul);
  const months = rndInt(2,6);
  const qualityReq = 50 + rndInt(0,35);
  const genre = pick(DATA.GENRES).name;
  const plat = pick(DATA.PLATFORMS.filter(p=>p.releaseYear<=state.date.year));
  return {
    id:'ct_'+Date.now()+'_'+Math.random(),
    name: `Contract: ${genre} game for ${plat.name}`,
    genre, platform:plat.id,
    budget, months, qualityReq,
    repReward: 1 + rndInt(0,3),
    accepted:false, active:false, progress:0,
    deadlineDay: null, startedAt:null,
  };
}

function refreshContractOffers(){
  state.contractOffers = [];
  const n = rndInt(2,4);
  for(let i=0;i<n;i++) state.contractOffers.push(generateContractOffer());
}

function acceptContract(offerId){
  const o = state.contractOffers.find(c=>c.id===offerId);
  if(!o) return;
  if(state.contracts.some(c=>c.active)){ toast('Уже есть активный контракт','warn');return; }
  o.accepted = true;
  o.active = true;
  o.startedAt = {year:state.date.year,month:state.date.month,day:state.date.day};
  o.deadlineDay = addDaysToDate(o.startedAt, o.months*30);
  state.contracts.push(o);
  state.contractOffers = state.contractOffers.filter(c=>c.id!==offerId);
  addNews(`Принят контракт: ${o.name}`, 'good');
  toast('Контракт принят','ok');
}

function addDaysToDate(d0, days){
  let {year,month,day} = d0;
  for(let i=0;i<days;i++){
    day++;
    const max = daysInMonth(year,month);
    if(day>max){day=1;month++;if(month>11){month=0;year++;}}
  }
  return {year,month,day};
}

function progressContractByDays(days){
  for(const c of state.contracts){
    if(!c.active) continue;
    const skillSum = state.employees.reduce((s,e)=>s+e.skill,0) + state.skills.programming*2 + state.skills.design*2;
    const rate = clamp(skillSum / (200 + c.months*40), 0.3, 3);
    c.progress = clamp(num(c.progress) + rate*days/ (c.months*30), 0, 1);
    if(c.progress>=1){
      c.active=false;
      const success = c.qualityReq <= (70 + state.rep);
      const reward = success ? c.budget : Math.round(c.budget*0.5);
      earn(reward, 'contract');
      state.rep = add(state.rep, success?c.repReward:0);
      state.skills.programming = clamp(state.skills.programming + 1,1,100);
      state.skills.design = clamp(state.skills.design + 1,1,100);
      addNews(`Контракт выполнен: ${c.name} — ${fmt(reward)}`, 'good');
      toast(`Контракт выполнен: ${fmt(reward)}`,'ok');
    }
    const now = state.date;
    const overdue = compareDate(now, c.deadlineDay) > 0;
    if(overdue && c.active){
      c.active = false;
      state.rep = sub(state.rep, 2);
      addNews(`Провален контракт: ${c.name}`, 'bad');
      toast('Просрочен контракт!','err');
    }
  }
}

function compareDate(a,b){
  if(a.year!==b.year) return a.year-b.year;
  if(a.month!==b.month) return a.month-b.month;
  return a.day-b.day;
}

function startProject(opts){
  const diff = DATA.DIFFICULTY[state.player.difficulty]||DATA.DIFFICULTY.normal;
  const sizeDef = DATA.PROJECT_SIZES.find(s=>s.id===opts.size);
  if(!sizeDef) return {error:'Invalid size'};
  const totalCost = Math.round(sizeDef.cost * diff.devCostMul + (opts.marketing||0));
  if(state.money < totalCost*0.3) return {error:'Недостаточно денег для старта'};

  const totalDays = Math.round(sizeDef.days * (1 + (opts.marketing||0)/50000*0.1));
  const project = {
    id:'pr_'+Date.now()+'_'+Math.random(),
    type:'game',
    name: opts.name,
    genre: opts.genre,
    theme: opts.theme,
    platform: opts.platform,
    size: opts.size,
    marketing: num(opts.marketing),
    publisher: opts.publisher||null,
    engineId: opts.engineId||null,
    stage:0, stageProgress:0, totalDays, daysElapsed:0,
    budgetSpent:0, spentInitial: totalCost,
    quality:{graphics:0,design:0,tech:0,audio:0,polish:0},
    bugs:0,
    startedAt:{year:state.date.year,month:state.date.month,day:state.date.day},
    released:false, hype: 0,
    _accumulatedQuality:{graphics:0,design:0,tech:0,audio:0,polish:0},
  };

  let advance = 0;
  if(project.publisher){
    advance = project.publisher.advance;
    project.publisher_marketing = project.publisher.marketing;
    earn(advance, 'advance');
    addNews(`Издатель ${project.publisher.name} предоставил аванс ${fmt(advance)}`, 'good');
  }
  spend(totalCost - advance*0.5, 'development');
  project.budgetSpent = totalCost;
  project.hype = clamp(5 + state.rep*0.3 + (project.publisher? project.publisher.marketing/20000 : 0), 0, 100);

  state.projects.push(project);
  addNews(`Начата разработка: "${project.name}" (${project.genre}/${project.theme})`, 'good');
  toast('Проект запущен','ok');
  return {ok:true};
}

function projectStageProgress(project){
  const stage = DATA.STAGES[project.stage];
  if(!stage) return 1;
  return clamp(project.stageProgress / (project.totalDays*stage.weight), 0, 1);
}

function projectProgress(project){
  let done = 0;
  for(let i=0;i<project.stage;i++) done += DATA.STAGES[i].weight;
  if(project.stage < DATA.STAGES.length){
    done += DATA.STAGES[project.stage].weight * projectStageProgress(project);
  }
  return clamp(done, 0, 1);
}

function projectTick(project, days=1){
  const stage = DATA.STAGES[project.stage];
  if(!stage) return;

  const employees = state.employees;
  const skillMul = 1 +
    state.skills.programming*0.004 +
    state.skills.design*0.004 +
    state.skills.art*0.003 +
    state.skills.audio*0.003 +
    state.skills.management*0.002;
  const empSkill = employees.reduce((s,e)=>s + e.skill*0.02, 0);
  const empCount = employees.length;
  const teamMul = 1 + empSkill + empCount*0.15;
  const engineMul = project.engineId ? 1.15 : 1.0;
  const productivity = teamMul * skillMul * engineMul;

  const stageDays = project.totalDays * stage.weight;
  project.stageProgress += days * productivity;
  project.daysElapsed += days;
  state.energy = clamp(state.energy - 0.4*days, 0, 100);

  const genreDef = DATA.GENRES.find(g=>g.id===project.genre) || DATA.GENRES[0];
  const base = genreDef.base;

  const gainPerDay = {
    graphics: productivity*0.35*base.g,
    design:   productivity*0.32*base.d,
    tech:     productivity*0.30*base.t,
    audio:    productivity*0.28*base.a,
  };
  const k = days*0.10;
  for(const key of ['graphics','design','tech','audio']){
    project._accumulatedQuality[key] += gainPerDay[key]*k;
  }

  const bugRate = (project.size==='aaa' ? 1.5 : 0.3);
  const qaMitigation = employees.some(e=>e.role==='qa') ? 0.5 : 1.0;
  if(project.stage>=3) project.bugs += days * (0.5 + bugRate) * qaMitigation;

  if(project.stageProgress >= stageDays){
    project.stageProgress = 0;
    project.stage++;
    if(project.stage >= DATA.STAGES.length){
      releaseProject(project);
      return;
    }
    addNews(`"${project.name}" — стадия ${DATA.STAGES[project.stage].name}`, '');
  }
}

function releaseProject(project){
  const sizeDef = DATA.PROJECT_SIZES.find(s=>s.id===project.size) || DATA.PROJECT_SIZES[0];
  const q = project._accumulatedQuality;
  const norm = Math.max(1, project.totalDays * 0.45);

  let graphics = clamp(30 + (q.graphics/norm)*60, 0, sizeDef.qualityCap);
  let design   = clamp(30 + (q.design/norm)*60, 0, sizeDef.qualityCap);
  let tech     = clamp(30 + (q.tech/norm)*60, 0, sizeDef.qualityCap);
  let audio    = clamp(30 + (q.audio/norm)*60, 0, sizeDef.qualityCap);
  const polish = clamp(70 - project.bugs*0.8 + state.skills.management*0.2, 0, 100);

  graphics = clamp(graphics + rnd(-4,4), 0, 100);
  design   = clamp(design   + rnd(-4,4), 0, 100);
  tech     = clamp(tech     + rnd(-4,4), 0, 100);
  audio    = clamp(audio    + rnd(-4,4), 0, 100);

  const quality = Math.round(graphics*0.25 + design*0.30 + tech*0.20 + audio*0.10 + polish*0.15);
  const theme = DATA.THEMES.find(t=>t.id===project.theme);
  const synergy = (theme && theme.mod[project.genre]) ? theme.mod[project.genre] : 1;
  const finalQuality = clamp(Math.round(quality * synergy), 0, 100);

  const criticsRaw = finalQuality + rnd(-6,6) + (state.rep*0.15) + (project.marketing/5000*0.5);
  const critics = clamp(Math.round(criticsRaw), 5, 99);
  const playersRaw = finalQuality + rnd(-8,8) + Math.log10(1+state.fans)*3 + (state.hype*0.1);
  const players = clamp(Math.round(playersRaw), 5, 99);
  const platform = DATA.PLATFORMS.find(p=>p.id===project.platform);

  const released = {
    id: project.id, name: project.name,
    genre: project.genre, theme: project.theme,
    platform: project.platform, size: project.size,
    quality: finalQuality,
    graphics: Math.round(graphics), design: Math.round(design),
    tech: Math.round(tech), audio: Math.round(audio), polish: Math.round(polish),
    critics, players,
    releaseYear: state.date.year,
    releaseMonth: state.date.month,
    releaseDay: state.date.day,
    hypeAtRelease: project.hype,
    marketing: project.marketing,
    publisher: project.publisher,
    engineId: project.engineId,
    totalSales: 0, lifetimeRevenue: 0,
    lastMonthSales:0, lastMonthRevenue:0,
    dlcCount:0, dlcBoost:0,
    ports: [], isPort:false, parentId: null,
    origin: project.type==='remake' ? 'remake' : 'original',
    compPenalty: 1, history: [], awards: [],
  };

  state.releasedGames.push(released);
  state.projects = state.projects.filter(p=>p.id!==project.id);
  state.stats.gamesReleased++;

  if(!state.stats.bestGame || finalQuality > state.stats.bestGame.quality){
    state.stats.bestGame = {name:released.name, quality:finalQuality};
  }
  if(critics > state.stats.bestReview) state.stats.bestReview = critics;

  let ip = state.ips.find(i=>i.name===released.name);
  if(!ip){
    ip = { id:'ip_'+released.id, name: released.name, popularity: 10, fans: 0, games: [released.id], revenue: 0 };
    state.ips.push(ip);
  } else ip.games.push(released.id);
  released.ipId = ip.id;

  const fanGain = Math.pow(Math.max(0,finalQuality), 1.8) * 0.6 * (1 + (platform?platform.marketSize/200:1));
  state.fans = add(state.fans, fanGain);

  const repGain = clamp((finalQuality-50)/15 + (critics-50)/25, -3, 4);
  state.rep = clamp(add(state.rep, repGain), 0, 100);

  addNews(`Выпущена игра "${released.name}" — Critic ${critics}, Player ${players}, Quality ${finalQuality}`, critics>=75?'good':(critics<50?'bad':''));
  toast(`Релиз: "${released.name}" — ${critics}/100`, critics>=75?'ok':(critics<50?'err':''));
  state.hype = clamp(state.hype + Math.max(0, (finalQuality-60)/10), 0, 100);
}

function portGame(gameId, newPlatformId){
  const g = state.releasedGames.find(x=>x.id===gameId);
  if(!g) return;
  const platform = DATA.PLATFORMS.find(p=>p.id===newPlatformId);
  if(!platform){ toast('Платформа недоступна','err'); return; }
  if(platform.releaseYear > state.date.year){ toast('Платформа ещё не вышла','warn'); return; }
  if(g.ports.some(p=>p.platform===newPlatformId)){ toast('Уже есть порт на эту платформу','warn'); return; }

  const baseCost = DATA.PORT_COST[g.size] || 5000;
  const age = monthsBetween({year:g.releaseYear,month:g.releaseMonth}, state.date);
  const ageMul = age<6?1.5:(age<24?1:0.7);
  const cost = Math.round(baseCost * ageMul * platform.difficulty);
  if(state.money < cost){ toast('Недостаточно денег для порта','err'); return; }
  spend(cost, 'port');

  const inherit = clamp(0.7 + state.skills.programming/300, 0.7, 1.05);
  const port = {
    id: 'port_'+Date.now(),
    platform: newPlatformId,
    quality: Math.round(g.quality * inherit),
    releaseYear: state.date.year,
    releaseMonth: state.date.month,
    releaseDay: state.date.day,
    totalSales:0, lifetimeRevenue:0, lastMonthSales:0, lastMonthRevenue:0,
    isPort:true, parentId:g.id,
    critics: Math.round(g.critics*rnd(0.9,1.05)),
    players: Math.round(g.players*rnd(0.9,1.05)),
    name: g.name + ' ('+platform.name+')',
    genre:g.genre, theme:g.theme, size:g.size, marketing:0, hypeAtRelease:0,
    graphics:g.graphics, design:g.design, tech:g.tech, audio:g.audio, polish:g.polish,
    dlcCount:0, dlcBoost:0, ports:[],
    ipId: g.ipId, origin:'port',
    publisher: g.publisher,
  };
  g.ports.push({platform:newPlatformId, releaseYear:state.date.year});
  state.releasedGames.push(port);
  addNews(`Порт "${g.name}" на ${platform.name}`, 'good');
  toast('Порт выпущен','ok');
}

function remakeGame(gameId, newName){
  const g = state.releasedGames.find(x=>x.id===gameId);
  if(!g) return;
  if(g.isPort){ toast('Порты нельзя переделывать в ремейк','warn'); return; }
  if(!newName || newName.length<2){ toast('Введите название','err'); return; }
  const sizeDef = DATA.PROJECT_SIZES.find(s=>s.id===g.size) || DATA.PROJECT_SIZES[0];
  const cost = Math.round(sizeDef.cost * 1.6);
  if(state.money < cost){ toast('Недостаточно денег для ремейка','err'); return; }
  if(state.projects.some(p=>p.type==='game')){ toast('Сначала завершите активный проект','warn'); return; }
  spend(cost, 'remake');

  const proj = {
    id:'pr_'+Date.now(),
    type:'remake', name:newName,
    genre:g.genre, theme:g.theme, platform:g.platform, size:g.size,
    marketing:0, publisher:null, engineId:null,
    stage:0, stageProgress:0,
    totalDays: Math.round(sizeDef.days*0.6),
    daysElapsed:0, budgetSpent:cost, spentInitial:cost,
    quality:{graphics:0,design:0,tech:0,audio:0,polish:0},
    bugs:0,
    startedAt:{year:state.date.year,month:state.date.month,day:state.date.day},
    hype: clamp(g.critics*0.3 + state.rep*0.5, 5, 90),
    _accumulatedQuality:{
      graphics: g.graphics*2, design: g.design*2, tech: g.tech*2, audio: g.audio*2,
    },
    _parentId:g.id,
  };
  state.projects.push(proj);
  addNews(`Начат ремейк: "${newName}" (оригинал: ${g.name})`,'good');
  toast('Ремейк запущен','ok');
}

function reissueGame(gameId, kind){
  const g = state.releasedGames.find(x=>x.id===gameId);
  if(!g) return;
  const cost = Math.round((DATA.PORT_COST[g.size]||5000) * (kind==='goty'?0.6:0.4));
  if(state.money < cost){ toast('Недостаточно денег','err'); return; }
  spend(cost, 'reissue');
  g.dlcBoost = num(g.dlcBoost) + (kind==='goty'?0.6:0.35);
  g.hypeAtRelease = Math.max(g.hypeAtRelease, 40);
  addNews(`Переиздание "${g.name}" (${kind.toUpperCase()}) — ${fmt(cost)}`, 'good');
  toast('Переиздание выпущено','ok');
}

function addDLC(gameId){
  const g = state.releasedGames.find(x=>x.id===gameId);
  if(!g) return;
  if(g.isPort){ toast('DLC для портов не выпускается','warn'); return; }
  const cost = Math.round((DATA.PORT_COST[g.size]||3000) * 0.5);
  if(state.money < cost){ toast('Недостаточно денег','err'); return; }
  if(!state.research.completed.includes('audio') && !state.research.completed.includes('online') && !state.research.completed.includes('3d')){
    toast('Нужна хотя бы одна технология (2D+ уровень)','warn'); return;
  }
  spend(cost, 'dlc');
  g.dlcCount = (g.dlcCount|0) + 1;
  g.dlcBoost = num(g.dlcBoost) + 0.5;
  state.rep = add(state.rep, 0.3);
  addNews(`DLC для "${g.name}" выпущено — ${fmt(cost)}`, 'good');
  toast('DLC выпущено','ok');
}

function createEngine(opts){
  const cost = 5000 + (opts.graphics||0)*50 + (opts.physics||0)*40 + (opts.ai||0)*40 + (opts.tools||0)*40;
  if(state.money < cost){ toast('Недостаточно денег','err'); return; }
  spend(cost, 'engine');
  const days = 60 + Math.round((opts.graphics+opts.physics+opts.ai+opts.tools)/4);
  const engine = {
    id:'en_'+Date.now(),
    name: opts.name || 'Custom Engine',
    graphics: clamp(opts.graphics||50,1,100),
    physics:  clamp(opts.physics||50,1,100),
    ai:       clamp(opts.ai||50,1,100),
    tools:    clamp(opts.tools||50,1,100),
    builtYear: state.date.year,
    builtMonth: state.date.month,
    licensed: false,
    daysLeft: days, cost,
  };
  state.engines.push(engine);
  addNews(`Разработка движка "${engine.name}" началась (${days} дней)`, 'good');
  toast('Движок в разработке','ok');
}

function tickEngines(days){
  for(const e of state.engines){
    if(e.daysLeft>0){
      e.daysLeft = Math.max(0, e.daysLeft - days);
      if(e.daysLeft===0){
        addNews(`Движок "${e.name}" готов!`, 'good');
        toast(`Движок "${e.name}" готов`,'ok');
      }
    }
  }
}

function licenseEngine(engineId){
  const e = state.engines.find(x=>x.id===engineId);
  if(!e) return;
  if(e.daysLeft>0){ toast('Движок ещё в разработке','warn'); return; }
  if(e.licensed){ toast('Уже лицензирован','warn'); return; }
  e.licensed = true;
  const income = 2000 + (e.graphics+e.physics+e.ai+e.tools)*50;
  earn(income, 'license');
  addNews(`Движок "${e.name}" лицензирован — ${fmt(income)}`, 'good');
  toast('Движок лицензирован','ok');
}

function startResearch(id){
  const r = DATA.RESEARCH.find(x=>x.id===id);
  if(!r) return;
  if(state.research.completed.includes(id)){ toast('Уже изучено','warn'); return; }
  if(state.research.active){ toast('Уже идёт исследование','warn'); return; }
  if(r.year > state.date.year){ toast('Технология ещё не появилась','warn'); return; }
  for(const req of r.req){
    if(!state.research.completed.includes(req)){ toast('Требуется: '+req,'warn'); return; }
  }
  if(state.money < r.cost){ toast('Недостаточно денег','err'); return; }
  spend(r.cost, 'research');
  state.research.active = { id, daysLeft: r.days, totalDays: r.days };
  addNews(`Начато исследование: ${r.name}`,'good');
  toast('Исследование начато','ok');
}

function tickResearch(days){
  const a = state.research.active;
  if(!a) return;
  a.daysLeft = Math.max(0, a.daysLeft - days);
  if(a.daysLeft<=0){
    state.research.completed.push(a.id);
    if(!state.research.unlocked.includes(a.id)) state.research.unlocked.push(a.id);
    const r = DATA.RESEARCH.find(x=>x.id===a.id);
    if(r){
      addNews(`Исследование завершено: ${r.name}`,'good');
      toast(`Изучено: ${r.name}`,'ok');
      if(r.effect){
        if(r.effect.graphics) state.skills.art = clamp(state.skills.art+1,1,100);
        if(r.effect.tech) state.skills.programming = clamp(state.skills.programming+1,1,100);
        if(r.effect.design) state.skills.design = clamp(state.skills.design+1,1,100);
        if(r.effect.audio) state.skills.audio = clamp(state.skills.audio+1,1,100);
      }
    }
    state.research.active = null;
  }
}

function hireEmployee(role){
  const roleDef = DATA.ROLES.find(r=>r.id===role);
  if(!roleDef){ toast('Unknown role','err'); return; }
  const skill = clamp(rndInt(15, 55) + Math.floor(state.rep*0.5), 5, 95);
  const salary = Math.round(rnd(roleDef.salary[0], roleDef.salary[1]) * (0.7 + skill/100));
  const hireCost = Math.round(salary * 1.2);
  if(state.money < hireCost){ toast('Недостаточно денег для найма','err'); return; }
  spend(hireCost, 'hire');
  const e = {
    id:'em_'+Date.now()+'_'+Math.random(),
    name: pick(DATA.NAMES)+' '+pick(DATA.NAME_SUR),
    role: roleDef.id, roleName: roleDef.name,
    skill, salary, exp: 0, morale: 70,
    hiredAt: state.date.year,
    stats: { games: 0 },
  };
  state.employees.push(e);
  addNews(`Нанят сотрудник: ${e.name} (${roleDef.name}, skill ${skill})`, 'good');
  toast(`Нанят: ${e.name}`, 'ok');
}

function fireEmployee(id){
  const e = state.employees.find(x=>x.id===id);
  if(!e) return;
  state.employees = state.employees.filter(x=>x.id!==id);
  spend(e.salary*2, 'severance');
  state.rep = sub(state.rep, 0.3);
  addNews(`Уволен сотрудник: ${e.name}`, 'warn');
  toast('Сотрудник уволен','warn');
}

function promoteEmployee(id){
  const e = state.employees.find(x=>x.id===id);
  if(!e) return;
  if(e.skill<40){ toast('Слишком низкий навык','warn'); return; }
  const cost = 1500;
  if(state.money<cost){ toast('Недостаточно денег','err'); return; }
  spend(cost,'training');
  e.skill = clamp(e.skill+3,1,100);
  e.morale = clamp(e.morale+10,0,100);
  e.salary = Math.round(e.salary*1.15);
  toast(`${e.name} повышен`, 'ok');
}

function holdAwards(){
  const thisYear = state.date.year;
  const candidates = state.releasedGames.filter(g=>g.releaseYear===thisYear);
  if(candidates.length===0) return;
  for(const a of DATA.AWARDS){
    let best=null, bestScore=-1;
    for(const g of candidates){
      const base = g.quality;
      const weightBonus = ({
        quality: base,
        debut: state.stats.gamesReleased<=3 ? base+5 : base-5,
        graphics: g.graphics + 3,
        audio: g.audio + 3,
        design: g.design + 3,
        tech: g.tech + 3,
        popularity: g.players + Math.log10(1+state.fans)*3,
      })[a.weight] ?? base;
      const score = weightBonus + Math.random()*15;
      if(score>bestScore){bestScore=score;best=g;}
    }
    if(best && best.quality>=75 && Math.random()<0.55){
      best.awards.push(a.id);
      state.awards.push({awardId:a.id, gameId:best.id, year:thisYear});
      state.rep = add(state.rep, 2);
      state.hype = clamp(state.hype+10, 0, 100);
      state.fans = add(state.fans, 200 + best.quality*10);
      addNews(`🏆 "${best.name}" получила награду: ${a.name}!`, 'good');
    }
  }
  state.stats.awards = state.awards.length;
}

function triggerRandomEvent(){
  const ev = pick(DATA.EVENTS);
  if(!ev) return;
  const result = ev.apply(state) || {};
  if(result.money!==undefined) state.money = result.money;
  if(result.fans!==undefined) state.fans = Math.max(0, result.fans);
  if(result.rep!==undefined) state.rep = clamp(result.rep,0,100);
  if(result.hype!==undefined) state.hype = clamp(result.hype,0,100);

  if(result.quit && state.employees.length>0){
    const idx = rndInt(0, state.employees.length-1);
    const e = state.employees[idx];
    state.employees.splice(idx,1);
    result.news = `${e.name} покинул студию.`;
  }
  if(result.boost && state.employees.length>0){
    const e = pick(state.employees);
    e.skill = clamp(e.skill+2,1,100);
    e.morale = clamp(e.morale+5,0,100);
    result.news = `${e.name} показал отличные результаты (+2 skill).`;
  }
  if(result.feeChange){
    const p = pick(DATA.PLATFORMS);
    p.fee = clamp(p.fee + rnd(-0.03, 0.03), 0, 0.4);
    result.news = `Платформа ${p.name} изменила комиссию до ${(p.fee*100).toFixed(0)}%.`;
  }
  if(result.news) addNews(result.news, ev.kind==='bad'?'bad':(ev.kind==='good'?'good':'warn'));
}

function initCompetitors(){
  state.competitors = DATA.COMPETITORS.map(c=>({
    id:c.id, name:c.name, type:c.type, skill:c.skill,
    hype: rnd(20,80),
    fans: c.type==='major'? rnd(5000,50000) : rnd(200,3000),
    lastRelease: null,
    _cd: rndInt(6,24),
  }));
}

function ensureCompetitors(){
  if(!Array.isArray(state.competitors) || state.competitors.length===0){
    initCompetitors();
  }
}

function competitorMonthTick(){
  if(!state.competitors || state.competitors.length===0){ initCompetitors(); return; }
  for(const c of state.competitors){
    c._cd = (c._cd||rndInt(3,12)) - 1;
    if(c._cd<=0){
      const genre = pick(DATA.GENRES).id;
      const quality = clamp(Math.round(c.skill + rnd(-10,10)), 20, 99);
      const critics = clamp(Math.round(quality + rnd(-6,6)), 10, 99);
      const sales = Math.round((c.type==='major'? rnd(2e6,20e6) : rnd(5e4,1.2e6)) * (quality/80));
      c.lastRelease = {
        year:state.date.year, month:state.date.month,
        name: generateRivalTitle(), genre, critics, sales,
      };
      c.hype = clamp(c.hype + rnd(-10,20), 0, 100);
      c.fans = add(c.fans, sales*0.05);
      if(c.type==='indie' && c.fans>200000) c.type='major';
      addNews(`🎮 ${c.name} выпустила "${c.lastRelease.name}". Жанр: ${genre}. Оценка: ${critics}. Продажи: ${fmtNum(sales)}`, c.type==='indie'?'warn':'');
      c._cd = rndInt(c.type==='major'?12:8, c.type==='major'?36:24);
    }
  }
}

function generateRivalTitle(){
  const a = ['Dark','Crimson','Silent','Neon','Eternal','Shadow','Iron','Lost','Neo','Wild','Cosmic','Frozen','Hollow','Radiant','Broken'];
  const b = ['Forest','Empire','Saga','Protocol','Rift','Chronicles','Legacy','Vortex','Kingdom','Nexus','Omen','Requiem','Circuit','Frontier','Echoes'];
  return pick(a)+' '+pick(b);
}

function addNews(text, kind=''){
  state.news.unshift({
    id:'nw_'+Date.now()+'_'+Math.random(),
    date: {year:state.date.year,month:state.date.month,day:state.date.day},
    text, kind,
  });
  if(state.news.length>200) state.news.length=200;
}

function checkTimeline(){
  for(let i=0;i<DATA.TIMELINE.length;i++){
    if(state.timelineDone.includes(i)) continue;
    const ev = DATA.TIMELINE[i];
    if(ev.year < state.date.year){ state.timelineDone.push(i); addNews(ev.text, 'hist'); continue; }
    if(ev.year === state.date.year && (ev.month-1) <= state.date.month){
      state.timelineDone.push(i);
      addNews(`📅 ${ev.text}`, 'hist');
    }
  }
}

function tryDailyBonus(){
  const today = new Date().toISOString().slice(0,10);
  if(state.flags.lastDaily === today) return null;
  const yest = new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(state.flags.lastDaily === yest) state.flags.dailyStreak = (state.flags.dailyStreak||0)+1;
  else state.flags.dailyStreak = 1;
  state.flags.lastDaily = today;
  const streak = state.flags.dailyStreak;
  const mult = 1 + Math.min(streak,7)*0.25;
  const reward = {
    money: Math.round((2000 + state.rep*500) * mult),
    energy: 20,
    rep: Math.round(1*mult),
    fans: Math.round(50*mult),
    research: 1,
  };
  state.money = add(state.money, reward.money);
  state.energy = clamp(state.energy + reward.energy, 0, 100);
  state.rep = clamp(add(state.rep, reward.rep), 0, 100);
  state.fans = add(state.fans, reward.fans);
  state.hype = clamp(state.hype + 5*mult, 0, 100);
  return { reward, streak };
}

function careerSummary(){
  const startYear = state.player.startYear || state.date.year;
  const years = Math.max(0, state.date.year - startYear);
  return {
    yearsInIndustry: years,
    gamesReleased: state.stats.gamesReleased,
    bestGame: state.stats.bestGame ? state.stats.bestGame.name : '—',
    bestReview: state.stats.bestReview,
    totalSales: Math.round(state.stats.totalSales),
    totalRevenue: Math.round(state.stats.totalRevenue),
    awards: state.awards.length,
    fans: Math.round(state.fans),
    employees: state.employees.length,
    money: Math.round(state.money),
    rep: state.rep,
  };
}

function renderMarket(){

  const falling = trends.slice().reverse().filter(t=>t.v<0.95).slice(0,4);

function confirmNewProject(){
  const g = $('#np-name')?.value.trim() || 'Untitled';
  const genre = $('#np-genre').value;
  const theme = $('#np-theme').value;
  const platform = $('#np-platform').value;
  const size = $('#np-size').value;
  const marketing = num($('#np-mkt').value);
  const engineId = $('#np-engine').value || null;
  const pubId = $('#np-publisher').value;

  let publisher = null;
  if(pubId){
    const pdef = DATA.PUBLISHERS.find(x=>x.id===pubId);
    if(pdef){
      publisher = {
        id: pdef.id, name: pdef.name,
        advance: Math.round(rnd(pdef.advance[0], pdef.advance[1]) * (1+state.rep/60)),
        share: pdef.share,
        marketing: Math.round(rnd(pdef.marketing[0], pdef.marketing[1])),
        platforms: pdef.platforms,
        genrePreference: pdef.genres,
      };
    }
  }

  if(state.projects.some(p=>p.type==='game')){ toast('Сначала завершите текущий проект','warn'); return; }
  const res = startProject({
    name: g, genre, theme, platform, size, marketing, publisher, engineId
  });
  if(res.error){ toast(res.error,'err'); return; }
  closeAllModals();
}

function renderHistoryChart(hist, key, color){
  if(!hist || hist.length<2) return '<div class="sub">Недостаточно данных.</div>';
  const w=400,h=100,pad=4;
  const vals = hist.map(d=>num(d[key]));
  const max = Math.max(1, ...vals);
  const min = Math.min(0, ...vals);
  const range = (max-min) || 1;
  const pts = vals.map((v,i)=>{
    const x = pad + (i/(vals.length-1))*(w-pad*2);
    const y = h-pad - ((v-min)/range)*(h-pad*2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const last = vals[vals.length-1]|0;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline fill="none" stroke="${color}" stroke-width="1.8" points="${pts}" />
  </svg>
  <div class="sub">Последнее: ${key==='money'?fmt(last):fmtNum(last)}</div>`;
}

function bindMain(){
  $$('#main [data-action]').forEach(el=>{
    el.addEventListener('click', handleAction);
  });
}

function handleAction(e){
  const btn = e.currentTarget;
  const a = btn.dataset.action;
  const id = btn.dataset.id;
  switch(a){
    case 'tab': currentTab = btn.dataset.tab; syncTabs(); renderCurrent(); break;
    case 'new-project': modalNewProject(); break;
    case 'hire': modalHire(); break;
    case 'new-engine': modalNewEngine(); break;
    case 'open-contracts': modalContracts(); break;
    case 'career': modalCareer(); break;
    case 'about': modalAbout(); break;
    case 'daily': {
      const r = tryDailyBonus();
      if(!r) toast('Уже получено сегодня','warn');
      else toast(`🎁 Бонус! Streak ${r.streak} · +${fmt(r.reward.money)}`,'ok');
      renderCurrent();
      break;
    }
    case 'save': saveGame(); toast('Сохранено','ok'); break;
    case 'export': exportSave(); break;
    case 'import': importSave(); break;
    case 'reset': modalReset(); break;
    case 'port': modalPort(id); break;
    case 'dlc': addDLC(id); renderCurrent(); break;
    case 'reissue': modalReissue(id); break;
    case 'remake': modalRemake(id); break;
    case 'fire': fireEmployee(id); renderCurrent(); break;
    case 'promote': promoteEmployee(id); renderCurrent(); break;
    case 'research': startResearch(id); renderCurrent(); break;
    case 'license-engine': licenseEngine(id); renderCurrent(); break;
    case 'close-modal': closeAllModals(); break;
    case 'confirm-project': confirmNewProject(); break;
    case 'confirm-engine': confirmNewEngine(); break;
    case 'confirm-hire': hireEmployee(btn.dataset.role); closeAllModals(); renderCurrent(); break;
    case 'confirm-port': portGame(id, $('#pt-plat').value); closeAllModals(); renderCurrent(); break;
    case 'confirm-remake': remakeGame(id, $('#rm-name').value.trim()); closeAllModals(); renderCurrent(); break;
    case 'confirm-reissue': reissueGame(id, btn.dataset.kind); closeAllModals(); renderCurrent(); break;
    case 'accept-contract': acceptContract(id); closeAllModals(); renderCurrent(); break;
    case 'refresh-contracts': refreshContractOffers(); closeAllModals(); modalContracts(); break;
    case 'confirm-reset':
      localStorage.removeItem(SAVE_KEY);
      localStorage.removeItem(BACKUP_KEY);
      location.reload();
      break;
  }
}

function syncTabs(){
  $$('#bottomnav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===currentTab));
}

function exportSave(){
  try{
    const blob = new Blob([JSON.stringify(state)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `indie-dev-tycoon-save-${Date.now()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    toast('Экспортировано','ok');
  }catch(e){ toast('Ошибка экспорта','err'); }
}

function importSave(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='application/json';
  inp.addEventListener('change',()=>{
    const f = inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const obj = JSON.parse(r.result);
        if(!obj || typeof obj!=='object' || !obj.date || !obj.player) throw new Error('bad');
        state = migrate(obj);
        ensureCompetitors();
        saveGame();
        toast('Импортировано','ok');
        renderCurrent();
      }catch(e){ toast('Некорректный файл','err'); }
    };
    r.readAsText(f);
  });
  inp.click();
}

// ============================================================
// GAME — init, topbar, start new game
// ============================================================
function bindTopBar(){
  $$('.spd').forEach(b=>{
    b.addEventListener('click',()=>{
      speed = +b.dataset.speed;
      $$('.spd').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
    });
  });
  $('#btn-step-day').addEventListener('click',()=>{
    if(!state) return;
    tickDay(); saveGame(); renderCurrent();
  });
  $('#btn-step-week').addEventListener('click',()=>{
    if(!state) return;
    for(let i=0;i<7;i++) tickDay();
    saveGame(); renderCurrent();
  });
  $$('#bottomnav button').forEach(b=>{
    b.addEventListener('click',()=>{
      currentTab = b.dataset.tab;
      syncTabs();
      renderCurrent();
    });
  });
}

function showStartScreen(){
  const cSel = $('#in-country');
  cSel.innerHTML = DATA.COUNTRIES.map(c=>`<option value="${c.id}">${c.name} — capital ~${fmt(c.startCapital)}, tax ${(c.tax*100).toFixed(0)}%</option>`).join('');

  const ySel = $('#in-year');
  let html='';
  for(let y=2000;y<=2026;y++) html+=`<option value="${y}" ${y===2008?'selected':''}>${y}</option>`;
  ySel.innerHTML = html;

  if(localStorage.getItem(SAVE_KEY)||localStorage.getItem(BACKUP_KEY)){
    const btn = $('#btn-continue');
    btn.style.display='block';
    btn.addEventListener('click',()=>{
      const s = loadGame();
      if(!s){ toast('Сохранение повреждено','err'); return; }
      state = s;
      startGame(true);
    });
  }

  $('#btn-start').addEventListener('click',()=>{
    const name = $('#in-name').value.trim() || 'Alex';
    const studio = $('#in-studio').value.trim() || 'Pixel Forge';
    const country = $('#in-country').value;
    const year = +$('#in-year').value;
    const diff = $('#in-diff').value;
    startNewGame({name, studio, country, year, difficulty:diff});
  });
}

function startNewGame(opts){
  state = newState();
  state.player.name = opts.name;
  state.player.studio = opts.studio;
  state.player.country = opts.country;
  state.player.difficulty = opts.difficulty;
  state.player.startYear = opts.year;
  const c = DATA.COUNTRIES.find(x=>x.id===opts.country) || DATA.COUNTRIES[0];
  const diff = DATA.DIFFICULTY[opts.difficulty] || DATA.DIFFICULTY.normal;
  state.money = Math.round(c.startCapital * diff.startMul);
  state.date = {year:opts.year, month:0, day:1};
  state.flags.lastDayTs = Date.now();
  state.flags.startedAt = Date.now();
  initCompetitors();
  updateTrends();
  addNews(`Студия "${opts.studio}" основана в ${opts.year} году.`, 'hist');
  saveGame();
  startGame(false);
}

function startGame(fromLoad){
  $('#start-screen').style.display='none';
  $('#app').style.display='';
  ensureCompetitors();
  syncTabs();
  renderCurrent();
  processOffline();
  if(!startLoop._running){
    startLoop._running = true;
    startLoop();
  }
}

window.addEventListener('beforeunload',()=>{
  if(state && !_offlineMode){
    state.flags.lastDayTs = Date.now();
    saveGame();
  }
});
window.addEventListener('pagehide',()=>{
  if(state && !_offlineMode){
    state.flags.lastDayTs = Date.now();
    saveGame();
  }
});

window.addEventListener('DOMContentLoaded', ()=>{
  showStartScreen();
  bindTopBar();
});

window.closeAllModals = closeAllModals;
</script>
</body>
</html>
